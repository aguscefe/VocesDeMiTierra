server {
    listen 80;
    server_name vocesdemitierra.duckdns.org;
    root /var/www/vocesdemitierra/dist;
    index index.html;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { try_files /__never_exists__ @laravel; }
    location = /up { try_files /__never_exists__ @laravel; }
    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/vocesdemitierra/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/vocesdemitierra/backend/public;
        fastcgi_pass unix:__PHP_SOCKET__;
    }
    location /storage/ {
        alias /var/www/vocesdemitierra/backend/storage/app/public/;
        expires 7d;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
